services:
  - type: web
    name: intelligent-email-assistant
    runtime: docker
    region: oregon
    plan: free
    
    # Environment
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5002
      - key: FRONTEND_URL
        fromDatabase:
          name: intelligent_email_db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: intelligent_email_db
          property: connectionString

  - type: pserv
    name: intelligent_email_db
    runtime: postgresql
    plan: free
    
    # Database size
    ipAllowList: []
    
    # Environment
    envVars:
      - key: POSTGRES_USER
        value: emailuser
      - key: POSTGRES_DB
        value: intelligent_email_prod