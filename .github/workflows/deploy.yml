name: Deploy Frontend to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find Path and Build
        run: |
          # 1. Automatically find the exact folder containing your package.json
          REAL_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "The exact path to your frontend folder is: $REAL_PATH"
          
          # 2. Navigate there, install and build
          cd "$REAL_PATH"
          npm ci
          npx vite build
          
          # 3. Copy the output folder over to the workspace
          mkdir -p $GITHUB_WORKSPACE/build_output
          cp -r dist/* $GITHUB_WORKSPACE/build_output/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
