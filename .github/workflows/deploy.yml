name: Deploy Frontend to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Frontend
        run: |
          # 1. Find the folder containing package.json
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "Found frontend directory at: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # 2. Find where index.html actually lives
          HTML_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/dist/*" | head -n 1)
          echo "Found index.html at: $HTML_PATH"
          
          # 3. Install packages
          npm ci
          
          # 4. Build Vite, passing the correct location of index.html if it's nested
          if [ "$HTML_PATH" != "./index.html" ] && [ ! -f "./index.html" ]; then
            echo "index.html is nested. Creating a placeholder link for Vite..."
            HTML_DIR=$(dirname "$HTML_PATH")
            npx vite build --root "$HTML_DIR" --outDir "../../dist"
          else
            npx vite build
          fi
          
          # 5. Safely copy the output folder
          mkdir -p $GITHUB_WORKSPACE/build_output
          if [ -d "dist" ]; then
            cp -r dist/* $GITHUB_WORKSPACE/build_output/
          elif [ -d "../dist" ]; then
            cp -r ../dist/* $GITHUB_WORKSPACE/build_output/
          else
            # Fallback search for compiled folder
            DIST_DIR=$(find . -type d -name "dist" -not -path "*/node_modules/*" | head -n 1)
            cp -r "$DIST_DIR"/* $GITHUB_WORKSPACE/build_output/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
