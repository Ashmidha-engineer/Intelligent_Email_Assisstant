name: Deploy Frontend to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find Path and Build
        run: |
          # 1. Locate package.json and index.html
          PKG_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          HTML_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/dist/*" | head -n 1)
          
          echo "Package.json directory: $PKG_DIR"
          echo "Index.html path: $HTML_PATH"
          
          # 2. Go to the project directory and install packages
          cd "$PKG_DIR"
          npm ci
          
          # 3. Build Vite by explicitly defining where index.html lives relative to package.json
          # If index.html is sitting inside a 'frontend' subfolder, we pass that as the root.
          if [[ "$HTML_PATH" == *"/frontend/"* ]]; then
            echo "Building with frontend subfolder root..."
            npx vite build --root ./frontend --outDir ../dist
          else
            # Try building from the folder where index.html is located
            HTML_DIR=$(dirname "$HTML_PATH")
            if [ "$PKG_DIR" != "$HTML_DIR" ]; then
              cp "$GITHUB_WORKSPACE/$HTML_PATH" .
            fi
            npx vite build
          fi
          
          # 4. Copy the compiled distribution folder safely over to workspace
          mkdir -p $GITHUB_WORKSPACE/build_output
          if [ -d "dist" ]; then
            cp -r dist/* $GITHUB_WORKSPACE/build_output/
          else
            cp -r ../dist/* $GITHUB_WORKSPACE/build_output/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
