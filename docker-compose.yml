version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: intelligent_email_db
    environment:
      POSTGRES_USER: ${DB_USER:-emailuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-emailpassword123}
      POSTGRES_DB: ${DB_NAME:-intelligent_email_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Optional, for BullMQ queue)
  redis:
    image: redis:7-alpine
    container_name: intelligent_email_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application (Backend + Frontend served from same container)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelligent_email_assistant
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Server Config
      PORT: 5002
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5002
      
      # Database
      DATABASE_URL: postgresql://${DB_USER:-emailuser}:${DB_PASSWORD:-emailpassword123}@db:5432/${DB_NAME:-intelligent_email_dev}
      
      # Security
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-key-for-intelligent-email-assistant-32chars}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      
      # Google OAuth (optional for demo mode)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5002/api/auth/google/callback}
      
      # AI Providers (optional - simulator runs by default)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      
      # Redis
      REDIS_URL: redis://redis:6379
    
    ports:
      - "5002:5002"
    
    volumes:
      - ./backend/src:/app/backend/src
      - ./frontend/src:/app/frontend/src
    
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data: